version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - npm install --global npm@11.6.1
        - echo "Node.js version:"
        - node -v
        - echo "NPM version:"
        - npm -v
        - echo "Lock file version:"
        - node -p "require('./package-lock.json').lockfileVersion"
        - npm ci

    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - npm run build

  artifacts:
    baseDirectory: build
    files:
      - '**/*'